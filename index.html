<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Voice & Beat Studio Pro</title>
  
  <!-- CDN Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-color: #8a2be2;
      --accent-hover: #9f40f5;
      --text-color: #f0f0f5;
      --subtext-color: #a0a0b0;
      --border-color: #2e2e38;
      --danger-color: #e53e3e;
      --success-color: #38a169;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }

    header p {
      font-size: 0.85rem;
      color: var(--subtext-color);
      margin-top: 4px;
    }

    .section-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      background: var(--success-color);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .file-input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    input[type="file"] {
      background-color: var(--bg-color);
      border: 1px dashed var(--border-color);
      padding: 10px;
      border-radius: 8px;
      color: var(--subtext-color);
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.btn-danger {
      background-color: var(--danger-color);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      font-size: 0.85rem;
      color: var(--subtext-color);
      display: flex;
      justify-content: space-between;
    }

    select, input[type="range"] {
      width: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    .status-text {
      font-size: 0.8rem;
      color: var(--accent-hover);
      text-align: center;
      min-height: 1.2em;
    }

    .take-card {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .take-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .take-actions {
      display: flex;
      gap: 8px;
    }

    .take-actions button {
      padding: 4px 8px;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>GhostLab Audio Studio Pro</h1>
    <p>Multi-Track Voice & WavePadFX Rack</p>
  </header>

  <!-- 1. Beat Import & Generator Section -->
  <div class="section-card">
    <div class="section-title">
      <span>1. Import Beat & Generator</span> <span class="badge">✓</span>
    </div>
    
    <div class="file-input-wrapper">
      <label for="beatFileInput">Import Custom Beat (MP3/WAV):</label>
      <input type="file" id="beatFileInput" accept="audio/*">
    </div>

    <div class="control-group">
      <label for="genBeatSelect">Or Generate Synthetic Beat:</label>
      <select id="genBeatSelect">
        <option value="none" selected>None (Use Imported Beat File)</option>
        <option value="trap">Trap Hip-Hop Beat (140 BPM)</option>
        <option value="boombap">Boom Bap Classic Hip-Hop (90 BPM)</option>
        <option value="afro">Afrobeats / Drill Groove (105 BPM)</option>
        <option value="easy">Easy Pop Beat (120 BPM)</option>
      </select>
    </div>

    <div class="btn-grid">
      <button id="playBeatBtn">▶️ Play Beat</button>
      <button id="stopBeatBtn" class="btn-danger" disabled>⏹️ Stop Beat</button>
    </div>
  </div>

  <!-- 2. Vocal Recorder Section -->
  <div class="section-card">
    <div class="section-title">
      <span>2. Record Vocals</span> <span class="badge">✓</span>
    </div>
    <div class="btn-grid">
      <button id="recordBtn">🎙️ Start Recording</button>
      <button id="stopBtn" class="btn-danger" disabled>⏹️ Stop Recording</button>
    </div>
    <div class="status-text" id="statusText">Ready</div>
  </div>

  <!-- 3. Recorded Voices & Mix Settings -->
  <div class="section-card">
    <div class="section-title">
      <span>3. Vocal Takes & Track Mixing</span> <span class="badge">✓</span>
    </div>
    <div id="takesContainer" style="display:flex; flex-direction:column; gap:10px;">
      <p style="font-size:0.8rem; color:var(--subtext-color);">No voice takes recorded yet.</p>
    </div>
  </div>

  <!-- 4. Studio Effects Chain Section -->
  <div class="section-card">
    <div class="section-title">
      <span>4. Mastering FX Rack (WavePad Inspired)</span> <span class="badge">✓</span>
    </div>
    
    <div class="control-row">
      <div class="control-group">
        <label for="deessSlider">De-Essing Filter:</label>
        <input type="range" id="deessSlider" min="2000" max="8000" step="100" value="5000">
      </div>
      <div class="control-group">
        <label for="bassBoostSlider">Bass Boost (dB):</label>
        <input type="range" id="bassBoostSlider" min="0" max="12" step="1" value="3">
      </div>
    </div>

    <div class="control-row">
      <div class="control-group">
        <label for="delaySlider">Echo / Delay Wet:</label>
        <input type="range" id="delaySlider" min="0" max="0.8" step="0.05" value="0.1">
      </div>
      <div class="control-group">
        <label for="phaserSlider">Phaser FX Depth:</label>
        <input type="range" id="phaserSlider" min="0" max="1" step="0.05" value="0">
      </div>
    </div>

    <div class="control-row">
      <div class="control-group">
        <label for="reverbSlider">Reverb Pro:</label>
        <input type="range" id="reverbSlider" min="0" max="1" step="0.05" value="0.2">
      </div>
      <div class="control-group">
        <label for="eqHighSlider">High Treble Clarity:</label>
        <input type="range" id="eqHighSlider" min="-12" max="12" step="1" value="3">
      </div>
    </div>
  </div>

  <!-- 5. Master Playback & Export -->
  <div class="section-card">
    <div class="section-title">
      <span>5. Playback & Export Mix</span> <span class="badge">✓</span>
    </div>
    <div class="btn-grid">
      <button id="playBtn">▶️ Play Full Mix</button>
      <button id="stopMixBtn" class="btn-danger" disabled>⏹️ Stop Song</button>
    </div>
    <div style="margin-top: 10px;">
      <button id="exportBtn" style="width: 100%;">💾 Export MP3</button>
    </div>
  </div>
</div>

<script>
  let beatBuffer = null;
  let synthLoop = null;
  let importedBeatPlayer = null;
  let activeBeatType = 'none';
  
  let mediaRecorder = null;
  let recordedChunks = [];
  let vocalTakes = []; 
  let activeTakePlayers = [];

  // Studio FX Node Chain
  let deEsserNode = null;
  let bassBoostNode = null;
  let eqNode = null;
  let compressorNode = null;
  let delayNode = null;
  let phaserNode = null;
  let reverbNode = null;
  let limiterNode = null;

  // DOM Elements
  const beatFileInput = document.getElementById('beatFileInput');
  const genBeatSelect = document.getElementById('genBeatSelect');
  const playBeatBtn = document.getElementById('playBeatBtn');
  const stopBeatBtn = document.getElementById('stopBeatBtn');
  
  const recordBtn = document.getElementById('recordBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusText = document.getElementById('statusText');
  const takesContainer = document.getElementById('takesContainer');
  
  const deessSlider = document.getElementById('deessSlider');
  const bassBoostSlider = document.getElementById('bassBoostSlider');
  const delaySlider = document.getElementById('delaySlider');
  const phaserSlider = document.getElementById('phaserSlider');
  const reverbSlider = document.getElementById('reverbSlider');
  const eqHighSlider = document.getElementById('eqHighSlider');

  const playBtn = document.getElementById('playBtn');
  const stopMixBtn = document.getElementById('stopMixBtn');
  const exportBtn = document.getElementById('exportBtn');

  // Initialize Audio FX Rack
  function initStudioChain() {
    if (eqNode) return;

    deEsserNode = new Tone.Filter({
      frequency: parseFloat(deessSlider.value),
      type: "lowpass"
    });

    bassBoostNode = new Tone.Filter({
      frequency: 120,
      type: "lowshelf",
      gain: parseFloat(bassBoostSlider.value)
    });

    eqNode = new Tone.EQ3({
      low: 0,
      mid: 0,
      high: parseFloat(eqHighSlider.value)
    });

    compressorNode = new Tone.Compressor({
      threshold: -20,
      ratio: 4,
      attack: 0.005,
      release: 0.1
    });

    delayNode = new Tone.FeedbackDelay({
      delayTime: "8n",
      feedback: 0.2,
      wet: parseFloat(delaySlider.value)
    });

    phaserNode = new Tone.Phaser({
      frequency: 0.5,
      octaves: 3,
      baseFrequency: 350,
      wet: parseFloat(phaserSlider.value)
    });

    reverbNode = new Tone.Freeverb({
      dampening: 2000,
      roomSize: parseFloat(reverbSlider.value)
    });

    limiterNode = new Tone.Limiter(-0.5);

    deEsserNode.chain(
      bassBoostNode, 
      eqNode, 
      compressorNode, 
      delayNode, 
      phaserNode, 
      reverbNode, 
      limiterNode, 
      Tone.Destination
    );
  }

  function stopAllPlayback() {
    Tone.Transport.stop();
    Tone.Transport.cancel();
    
    if (synthLoop) {
      synthLoop.dispose();
      synthLoop = null;
    }
    if (importedBeatPlayer) {
      importedBeatPlayer.stop();
      importedBeatPlayer.dispose();
      importedBeatPlayer = null;
    }

    activeTakePlayers.forEach(p => {
      try { p.stop(); p.dispose(); } catch (e) {}
    });
    activeTakePlayers = [];

    playBeatBtn.disabled = false;
    stopBeatBtn.disabled = true;
    playBtn.disabled = false;
    stopMixBtn.disabled = true;
    statusText.innerText = "Playback stopped.";
  }

  // --- 1. BEAT GENERATOR & IMPORT LOGIC ---
  beatFileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    statusText.innerText = "Loading beat...";
    const arrayBuffer = await file.arrayBuffer();
    await Tone.start();
    beatBuffer = await Tone.getContext().decodeAudioData(arrayBuffer);
    activeBeatType = 'imported';
    genBeatSelect.value = 'none';
    statusText.innerText = "Beat file imported!";
  });

  genBeatSelect.addEventListener('change', (e) => {
    if (e.target.value !== 'none') {
      activeBeatType = e.target.value;
      statusText.innerText = `Selected: ${e.target.options[e.target.selectedIndex].text}`;
    } else if (beatBuffer) {
      activeBeatType = 'imported';
    } else {
      activeBeatType = 'none';
    }
  });

  function startBeatPlayback() {
    stopBeatPlayback();

    if (activeBeatType === 'imported' && beatBuffer) {
      importedBeatPlayer = new Tone.Player(beatBuffer).toDestination();
      importedBeatPlayer.start();
    } else if (activeBeatType !== 'none') {
      
      const kick = new Tone.MembraneSynth({ pitchDecay: 0.05, octave: 8 }).toDestination();
      const snare = new Tone.NoiseSynth({ volume: -8, envelope: { attack: 0.001, decay: 0.15, sustain: 0 } }).toDestination();
      const hihat = new Tone.MetalSynth({ volume: -20, envelope: { attack: 0.001, decay: 0.05, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4000 }).toDestination();

      let step = 0;

      if (activeBeatType === 'trap') {
        Tone.Transport.bpm.value = 140;
        synthLoop = new Tone.Loop((time) => {
          // 16th Note Trap Pattern
          if (step % 8 === 0 || step === 10 || step === 14) kick.triggerAttackRelease("C1", "8n", time);
          if (step === 4 || step === 12) snare.triggerAttackRelease("16n", time);
          if (step % 2 === 0 || step === 7 || step === 15) hihat.triggerAttackRelease("32n", time);
          step = (step + 1) % 16;
        }, "16n").start(0);

      } else if (activeBeatType === 'boombap') {
        Tone.Transport.bpm.value = 90;
        synthLoop = new Tone.Loop((time) => {
          // Classic 90s Boom Bap Pattern
          if (step === 0 || step === 3 || step === 10) kick.triggerAttackRelease("C1", "8n", time);
          if (step === 4 || step === 12) snare.triggerAttackRelease("16n", time);
          if (step % 2 === 0) hihat.triggerAttackRelease("16n", time);
          step = (step + 1) % 16;
        }, "16n").start(0);

      } else if (activeBeatType === 'afro') {
        Tone.Transport.bpm.value = 105;
        synthLoop = new Tone.Loop((time) => {
          // Afrobeats / Dancehall Syncopated Groove
          if (step === 0 || step === 6 || step === 10) kick.triggerAttackRelease("C1", "8n", time);
          if (step === 3 || step === 12) snare.triggerAttackRelease("16n", time);
          if (step % 2 === 0) hihat.triggerAttackRelease("16n", time);
          step = (step + 1) % 16;
        }, "16n").start(0);

      } else if (activeBeatType === 'easy') {
        Tone.Transport.bpm.value = 120;
        synthLoop = new Tone.Loop((time) => {
          if (step % 4 === 0) kick.triggerAttackRelease("C1", "8n", time);
          if (step === 4 || step === 12) snare.triggerAttackRelease("16n", time);
          step = (step + 1) % 16;
        }, "16n").start(0);
      }

      Tone.Transport.start();
    }
  }

  function stopBeatPlayback() {
    Tone.Transport.stop();
    Tone.Transport.cancel();
    if (synthLoop) {
      synthLoop.dispose();
      synthLoop = null;
    }
    if (importedBeatPlayer) {
      importedBeatPlayer.stop();
      importedBeatPlayer.dispose();
      importedBeatPlayer = null;
    }
  }

  playBeatBtn.addEventListener('click', async () => {
    await Tone.start();
    if (activeBeatType === 'none' && !beatBuffer) {
      alert("Please select or import a beat first.");
      return;
    }
    startBeatPlayback();
    playBeatBtn.disabled = true;
    stopBeatBtn.disabled = false;
    statusText.innerText = "▶️ Playing beat...";
  });

  stopBeatBtn.addEventListener('click', () => {
    stopBeatPlayback();
    playBeatBtn.disabled = false;
    stopBeatBtn.disabled = true;
    statusText.innerText = "Beat stopped.";
  });

  // --- 2. VOCAL RECORDING LOGIC ---
  recordBtn.addEventListener('click', async () => {
    await Tone.start();
    initStudioChain();

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        } 
      });

      mediaRecorder = new MediaRecorder(stream);
      recordedChunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        const blob = new Blob(recordedChunks, { type: 'audio/webm' });
        const arrayBuffer = await blob.arrayBuffer();
        const buffer = await Tone.getContext().decodeAudioData(arrayBuffer);
        
        const takeId = Date.now();
        const pNode = new Tone.Panner(0);
        const pitchShiftNode = new Tone.PitchShift({ pitch: 0 });
        
        pitchShiftNode.connect(pNode);
        pNode.connect(deEsserNode);

        vocalTakes.push({
          id: takeId,
          buffer: buffer,
          presetPitch: 0,
          manualPitch: 0,
          gainVal: 0,
          panVal: 0,
          pitchNode: pitchShiftNode,
          pannerNode: pNode
        });

        renderTakesList();
        stopBeatPlayback();

        statusText.innerText = `Voice Take Saved!`;
        recordBtn.disabled = false;
        stopBtn.disabled = true;
        playBeatBtn.disabled = false;
        stopBeatBtn.disabled = true;
      };

      mediaRecorder.start();
      
      if (activeBeatType !== 'none' || beatBuffer) {
        startBeatPlayback();
      }

      recordBtn.disabled = true;
      stopBtn.disabled = false;
      statusText.innerText = "🎙️ Recording voice...";
    } catch (err) {
      alert("Microphone access required.");
      console.error(err);
    }
  });

  stopBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
  });

  // --- 3. TRACK CONTROLS & GAIN/PAN ---
  function renderTakesList() {
    if (vocalTakes.length === 0) {
      takesContainer.innerHTML = `<p style="font-size:0.8rem; color:var(--subtext-color);">No voice takes recorded yet.</p>`;
      return;
    }

    takesContainer.innerHTML = '';
    vocalTakes.forEach((take, index) => {
      const totalPitch = take.presetPitch + take.manualPitch;

      const takeDiv = document.createElement('div');
      takeDiv.className = 'take-card';
      takeDiv.innerHTML = `
        <div class="take-header">
          <span>🎤 Voice Take #${index + 1}</span>
          <div class="take-actions">
            <button onclick="playTake(${take.id})">▶️ Listen</button>
            <button class="btn-danger" onclick="deleteTake(${take.id})">🗑️ Delete</button>
          </div>
        </div>
        
        <div class="control-row">
          <div class="control-group">
            <label>Gain (dB): <span>${take.gainVal}dB</span></label>
            <input type="range" min="-12" max="12" step="1" value="${take.gainVal}" oninput="updateTakeGain(${take.id}, this.value)">
          </div>
          <div class="control-group">
            <label>Pan: <span>${take.panVal < 0 ? 'L'+Math.abs(take.panVal) : take.panVal > 0 ? 'R'+take.panVal : 'Center'}</span></label>
            <input type="range" min="-1" max="1" step="0.1" value="${take.panVal}" oninput="updateTakePan(${take.id}, this.value)">
          </div>
        </div>

        <div class="control-group">
          <label>Voice Changer Preset:</label>
          <select onchange="updateTakePreset(${take.id}, this.value)">
            <option value="0" ${take.presetPitch === 0 ? 'selected' : ''}>Natural Studio — Pitch 0</option>
            <option value="2" ${take.presetPitch === 2 ? 'selected' : ''}>Light Male (Afrobeats) — Pitch +2</option>
            <option value="4" ${take.presetPitch === 4 ? 'selected' : ''}>Teen Boy — Pitch +4</option>
            <option value="-3" ${take.presetPitch === -3 ? 'selected' : ''}>Heavy Bass Male — Pitch -3</option>
            <option value="5" ${take.presetPitch === 5 ? 'selected' : ''}>Soft Female — Pitch +5</option>
            <option value="7" ${take.presetPitch === 7 ? 'selected' : ''}>Young Girl — Pitch +7</option>
          </select>
        </div>

        <div class="control-group">
          <label>Fine Pitch (Semitones): <span>${totalPitch > 0 ? '+' + totalPitch : totalPitch}</span></label>
          <input type="range" min="-12" max="12" step="1" value="${take.manualPitch}" oninput="updateTakePitch(${take.id}, this.value)">
        </div>
      `;
      takesContainer.appendChild(takeDiv);
    });
  }

  window.updateTakeGain = function(id, val) {
    const take = vocalTakes.find(t => t.id === id);
    if (take) {
      take.gainVal = parseFloat(val);
    }
  };

  window.updateTakePan = function(id, val) {
    const take = vocalTakes.find(t => t.id === id);
    if (take) {
      take.panVal = parseFloat(val);
      take.pannerNode.pan.value = take.panVal;
    }
  };

  window.updateTakePreset = function(id, presetVal) {
    const take = vocalTakes.find(t => t.id === id);
    if (take) {
      take.presetPitch = parseInt(presetVal);
      take.pitchNode.pitch = take.presetPitch + take.manualPitch;
      renderTakesList();
    }
  };

  window.updateTakePitch = function(id, pitchVal) {
    const take = vocalTakes.find(t => t.id === id);
    if (take) {
      take.manualPitch = parseInt(pitchVal);
      take.pitchNode.pitch = take.presetPitch + take.manualPitch;
      renderTakesList();
    }
  };

  window.playTake = async function(id) {
    await Tone.start();
    initStudioChain();
    const take = vocalTakes.find(t => t.id === id);
    if (take) {
      const player = new Tone.Player(take.buffer);
      player.volume.value = take.gainVal;
      player.connect(take.pitchNode);
      player.start();
    }
  };

  window.deleteTake = function(id) {
    vocalTakes = vocalTakes.filter(t => t.id !== id);
    renderTakesList();
  };

  // Real-time Effect Controls
  deessSlider.addEventListener('input', (e) => {
    if (deEsserNode) deEsserNode.frequency.value = parseFloat(e.target.value);
  });
  bassBoostSlider.addEventListener('input', (e) => {
    if (bassBoostNode) bassBoostNode.gain.value = parseFloat(e.target.value);
  });
  delaySlider.addEventListener('input', (e) => {
    if (delayNode) delayNode.wet.value = parseFloat(e.target.value);
  });
  phaserSlider.addEventListener('input', (e) => {
    if (phaserNode) phaserNode.wet.value = parseFloat(e.target.value);
  });
  reverbSlider.addEventListener('input', (e) => {
    if (reverbNode) reverbNode.roomSize.value = parseFloat(e.target.value);
  });
  eqHighSlider.addEventListener('input', (e) => {
    if (eqNode) eqNode.high.value = parseFloat(e.target.value);
  });

  // --- 4. PLAYBACK & EXPORT WITH FX ---
  playBtn.addEventListener('click', async () => {
    await Tone.start();
    stopAllPlayback();
    initStudioChain();

    if (activeBeatType !== 'none' || beatBuffer) {
      startBeatPlayback();
    }

    vocalTakes.forEach(take => {
      const player = new Tone.Player(take.buffer);
      player.volume.value = take.gainVal;
      player.connect(take.pitchNode);
      player.start();
      activeTakePlayers.push(player);
    });

    playBtn.disabled = true;
    stopMixBtn.disabled = false;
    statusText.innerText = "▶️ Playing full studio mix...";
  });

  stopMixBtn.addEventListener('click', () => {
    stopAllPlayback();
  });

  exportBtn.addEventListener('click', async () => {
    if (vocalTakes.length === 0 && !beatBuffer && activeBeatType === 'none') {
      alert("Please record vocals or select a beat first.");
      return;
    }

    statusText.innerText = "⏳ Mastering audio & encoding MP3...";

    let duration = 5;
    vocalTakes.forEach(take => {
      if (take.buffer.duration > duration) duration = take.buffer.duration;
    });
    if (beatBuffer && beatBuffer.duration > duration) duration = beatBuffer.duration;

    // Offline Mastering Graph
    const offlineBuffer = await Tone.Offline(async () => {
      const offLimiter = new Tone.Limiter(-0.5).toDestination();
      const offReverb = new Tone.Freeverb({ roomSize: parseFloat(reverbSlider.value) }).connect(offLimiter);
      const offPhaser = new Tone.Phaser({ wet: parseFloat(phaserSlider.value) }).connect(offReverb);
      const offDelay = new Tone.FeedbackDelay({ delayTime: "8n", wet: parseFloat(delaySlider.value) }).connect(offPhaser);
      const offComp = new Tone.Compressor({ threshold: -20, ratio: 4 }).connect(offDelay);
      const offEQ = new Tone.EQ3({ high: parseFloat(eqHighSlider.value) }).connect(offComp);
      const offBass = new Tone.Filter({ frequency: 120, type: "lowshelf", gain: parseFloat(bassBoostSlider.value) }).connect(offEQ);
      const offDeEsser = new Tone.Filter({ frequency: parseFloat(deessSlider.value), type: "lowpass" }).connect(offBass);

      if (activeBeatType === 'imported' && beatBuffer) {
        const beatPlayer = new Tone.Player(beatBuffer).toDestination();
        beatPlayer.start(0);
      }

      vocalTakes.forEach(take => {
        const offPanner = new Tone.Panner(take.panVal).connect(offDeEsser);
        const offPitch = new Tone.PitchShift({ pitch: take.presetPitch + take.manualPitch }).connect(offPanner);
        const vocalPlayer = new Tone.Player(take.buffer).connect(offPitch);
        vocalPlayer.volume.value = take.gainVal;
        vocalPlayer.start(0);
      });
    }, duration);

    encodeAudioBufferToMp3(offlineBuffer.get());
  });

  function encodeAudioBufferToMp3(audioBuffer) {
    const channels = audioBuffer.numberOfChannels;
    const sampleRate = audioBuffer.sampleRate;
    const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
    
    const left = audioBuffer.getChannelData(0);
    const right = channels > 1 ? audioBuffer.getChannelData(1) : left;

    const sampleBlockSize = 1152;
    const mp3Data = [];

    const leftInt16 = new Int16Array(left.length);
    const rightInt16 = new Int16Array(right.length);

    for (let i = 0; i < left.length; i++) {
      leftInt16[i] = left[i] < 0 ? left[i] * 0x8000 : left[i] * 0x7FFF;
      rightInt16[i] = right[i] < 0 ? right[i] * 0x8000 : right[i] * 0x7FFF;
    }

    for (let i = 0; i < leftInt16.length; i += sampleBlockSize) {
      const leftChunk = leftInt16.subarray(i, i + sampleBlockSize);
      const rightChunk = rightInt16.subarray(i, i + sampleBlockSize);
      
      let mp3buf = channels === 2 ? mp3encoder.encodeBuffer(leftChunk, rightChunk) : mp3encoder.encodeBuffer(leftChunk);
      if (mp3buf.length > 0) mp3Data.push(mp3buf);
    }

    const endBuf = mp3encoder.flush();
    if (endBuf.length > 0) mp3Data.push(endBuf);

    const blob = new Blob(mp3Data, { type: 'audio/mp3' });
    const url = URL.createObjectURL(blob);
    
    const downloadLink = document.createElement('a');
    downloadLink.href = url;
    downloadLink.setAttribute('download', 'SoundLab_Studio_Mix.mp3');
    downloadLink.style.display = 'none';
    document.body.appendChild(downloadLink);
    
    downloadLink.click();
    
    setTimeout(() => {
      document.body.removeChild(downloadLink);
      URL.revokeObjectURL(url);
    }, 100);

    statusText.innerText = "✅ MP3 Exported to downloads!";
  }
</script>
</body>
